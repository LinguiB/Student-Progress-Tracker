<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo" aria-hidden="true">☑️</div><div><h1>Student Progress Tracker</h1><p>Small steps. Clear progress.</p></div></div><div class="top-actions"><button id="backupTop" class="btn" type="button">⬇ Backup</button><button id="installBtn" class="btn primary" type="button">＋ Install app</button></div></header>
<div class="layout"><aside class="sidebar" id="sideNav"></aside><main class="content" id="content" aria-live="polite"></main></div>
<nav class="mobile-nav" id="mobileNav" aria-label="Main navigation"></nav>
<div class="footnote">Your information is stored in this browser on this device. Download backups regularly.</div>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NAV=[{id:'home',label:'Dashboard',short:'Home'},{id:'classes',label:'Classes & students',short:'Classes'},{id:'workshops',label:'Workshops',short:'Workshops',hint:'Create and manage your sessions'},{id:'attendance',label:'Attendance',short:'Attendance'},{id:'progress',label:'Student progress',short:'Progress'},{id:'grades',label:'Grades',short:'Grades',hint:'Add assessments and enter scores'},{id:'reports',label:'Reports & backup',short:'Reports',hint:'Export CSV files and restore a backup'}];const PRIMARY=['home','classes','attendance','progress'];
function ico(inner,size=22){return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`}
const ICON={home:ico('<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>'),classes:ico('<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.2c2.4.2 4 2.2 4 4.8"/>'),workshops:ico('<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>'),attendance:ico('<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8 5.7-5.8"/>'),progress:ico('<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/>'),grades:ico('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>'),reports:ico('<path d="M5 20V11M12 20V4M19 20v-6"/>'),more:ico('<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>'),download:ico('<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>'),install:ico('<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>')};
let page='home',selectedStudent='',deferredPrompt=null,toastTimer;
const blank=()=>({version:2,groups:[],workshops:[],attendance:{},progress:{},grades:{},items:['Preparation','Participation','Task completed','Reflection'],noteFont:'Georgia, serif',sessions:[],lastBackup:null});let data=blank();
function load(){try{const x=JSON.parse(localStorage.getItem('spt-rebuilt-v2')||'null');if(x&&x.version===2){data={...blank(),...x};return}}catch(e){console.warn('New app data could not be read',e)}try{const old=JSON.parse(localStorage.getItem('workshopTracker.v2')||'null');if(!old||!Array.isArray(old.groups)||!old.groups.length)return;const phases=old.phases||[];data.groups=old.groups.map(g=>({id:String(g.id),name:g.name||'Imported class',students:(g.students||[]).map(s=>({id:String(s.id||s.name),name:s.name||String(s.id||'Student')})),assessments:(old.gi||[]).map(a=>({id:String(a.id),name:a.name,max:Number(a.max)||10}))}));data.workshops=(old.workshops||[]).map(w=>({...w,id:String(w.id),groupId:String(w.groupId||old.gid||data.groups[0]?.id||''),name:w.name||'Workshop',date:w.date||today()}));data.items=phases.flatMap(ph=>(ph.items||[]).map(item=>(ph.name?ph.name+': ':'')+item));const itemMap=[];phases.forEach(ph=>(ph.items||[]).forEach(item=>itemMap.push({phase:ph,id:item,name:(ph.name?ph.name+': ':'')+item})));for(const [key,p] of Object.entries(old.prog||{})){const parts=key.split('|');if(parts.length<3||!p)continue;const [gid,sid,pid]=parts;const phase=phases.find(ph=>ph.id===pid);if(phase){(phase.items||[]).forEach((item,i)=>{if(p.c&&p.c[i])data.progress[progressKey(gid,sid,(phase.name?phase.name+': ':'')+item)]=true});if(p.log?.length)data.progress[progressKey(gid,sid,'__notes__')]=p.log.map(l=>[l.d,l.t].filter(Boolean).join(': ')).join('\n');if(p.tags&&Object.values(p.tags).some(Boolean))data.progress[progressKey(gid,sid,'__flag__')]=true}}for(const [key,val] of Object.entries(old.att||{})){if(!val)continue;const parts=key.split('|');if(parts.length>=3){const [gid,sid,wid]=parts;data.attendance[attendanceKey(gid,wid,sid)]=true}}for(const [key,val] of Object.entries(old.gr||{})){const parts=key.split('|');if(parts.length>=3){const [gid,sid,aid]=parts;data.grades[gradeKey(gid,sid,aid)]=val}}data.lastBackup=null;save();notify('Your previous tracker data was imported. Check the records and download a new backup.')}catch(e){console.warn('Legacy data migration skipped',e)}}function save(){try{localStorage.setItem('spt-rebuilt-v2',JSON.stringify(data));return true}catch(e){notify('Storage is full. Export a backup and remove large attachments or old data.');return false}}
